; supervisord runs nginx + sshd + flow-streamer + the small status API in one
; container. Each program logs to stdout so `docker logs ad-defender` shows
; everything interleaved.
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:firewall_setup]
; Insert ACCEPT rules at the top of the INPUT chain so subsequent DROP rules
; (added by flow_streamer for blocked attacker IPs) can't accidentally block
; the control-plane port (8002 = status_api, where /expect lives). Without
; this, the second attack onward gets the iptables DROP applied to its
; /expect call before the override can take effect.
command=bash -c "iptables -I INPUT 1 -p tcp --dport 8002 -j ACCEPT 2>&1 || true; sleep infinity"
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:flow_streamer]
command=python3 /app/flow_streamer.py
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:status_api]
command=uvicorn server:app --host 0.0.0.0 --port 8002
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

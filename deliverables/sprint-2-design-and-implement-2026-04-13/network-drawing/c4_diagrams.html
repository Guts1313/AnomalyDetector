<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>C4 diagrams — AnomalyDetector</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

  :root{
    --bg-deep:#05060a; --bg:#0a0d14;
    --text:#ededf2; --muted:#8a8f98; --faint:#5f6470;
    --accent:#6366f1; --accent-2:#818cf8; --purple:#9457ff;
    --green:#10b981; --red:#ef4444; --orange:#f97316; --cyan:#06b6d4;
    --blue:#3b82f6; --yellow:#eab308; --pink:#ec4899;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#000;font-family:'Inter',system-ui,Segoe UI,sans-serif;}
  .frame{
    width:1240px; padding:34px 38px 30px;
    background:
      radial-gradient(900px 520px at 50% 32%, rgba(99,102,241,0.16), transparent 70%),
      radial-gradient(700px 480px at 82% 88%, rgba(148,87,255,0.10), transparent 72%),
      var(--bg-deep);
    position:relative; overflow:hidden;
  }
  /* grid */
  .frame::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
    background-size:34px 34px, 34px 34px, 170px 170px, 170px 170px;
    mask-image:radial-gradient(120% 120% at 50% 40%, #000 55%, transparent 100%);
    pointer-events:none;
  }
  .head{position:relative; z-index:2; margin:0 0 6px;}
  .head h2{margin:0; font-size:22px; font-weight:700; color:var(--text); letter-spacing:-0.01em;}
  .head p{margin:4px 0 0; font-size:13px; color:var(--muted);}
  .badge{display:inline-block; font:600 11px/1 'Inter'; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent-2);
    border:1px solid rgba(129,140,248,.35); border-radius:999px; padding:5px 11px; margin-bottom:12px;
    background:rgba(99,102,241,.08);}
  svg{position:relative; z-index:2; display:block;}
  .legend{position:relative; z-index:2; display:flex; gap:18px; margin-top:10px; flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted);}
  .legend i{width:13px; height:13px; border-radius:4px; display:inline-block;}

  /* SVG node text */
  text{font-family:'Inter',sans-serif; fill:var(--text);}
  .ntitle{font-size:16px; font-weight:700;}
  .nsub{font-size:12px; font-weight:500; fill:var(--muted);}
  .ntag{font-size:10px; font-weight:700; letter-spacing:.12em; fill:var(--faint);}
  .alabel{font-size:12px; font-weight:600; fill:#cdd3e6;}
  .mono{font-family:'JetBrains Mono',monospace; font-size:11px; fill:var(--muted);}
</style>
</head>
<body>

<!-- ============================ CONTEXT ============================ -->
<div class="frame" id="context">
  <div class="head">
    <span class="badge">C4 · Level 1 — System context</span>
  </div>
  <svg width="1164" height="620" viewBox="0 0 1164 620">
    <defs>
      <linearGradient id="sysg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2a2f6e"/><stop offset="1" stop-color="#171a3a"/>
      </linearGradient>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#6366f1" flood-opacity="0.55"/>
      </filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/>
      </marker>
      <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
      </marker>
    </defs>

    <!-- arrows (under nodes) -->
    <g fill="none" stroke-width="2.2">
      <line x1="300" y1="168" x2="448" y2="292" stroke="#818cf8" marker-end="url(#arrow)"/>
      <line x1="300" y1="452" x2="448" y2="370" stroke="#818cf8" marker-end="url(#arrow)"/>
      <line x1="864" y1="168" x2="716" y2="292" stroke="#3b82f6" marker-end="url(#arrow)"/>
      <line x1="716" y1="372" x2="864" y2="452" stroke="#10b981" marker-end="url(#arrowG)"/>
    </g>
    <!-- arrow labels -->
    <g text-anchor="middle">
      <rect x="300" y="196" width="150" height="20" rx="6" fill="#0a0d14" opacity="0.7"/>
      <text class="alabel" x="375" y="210">views dashboard · HTTPS</text>
      <rect x="300" y="410" width="150" height="20" rx="6" fill="#0a0d14" opacity="0.7"/>
      <text class="alabel" x="375" y="424">retrains · /admin/reload</text>
      <rect x="710" y="196" width="160" height="20" rx="6" fill="#0a0d14" opacity="0.7"/>
      <text class="alabel" x="790" y="210">flow features · JSON/CSV</text>
      <rect x="712" y="410" width="156" height="20" rx="6" fill="#0a0d14" opacity="0.7"/>
      <text class="alabel" x="790" y="424">severity alerts · /alerts</text>
    </g>

    <!-- persons (left) -->
    <g filter="url(#soft)">
      <rect x="60" y="92" width="240" height="120" rx="16" fill="#10141f" stroke="#818cf8" stroke-width="1.6"/>
      <rect x="60" y="92" width="240" height="120" rx="16" fill="none" stroke="rgba(129,140,248,.25)" stroke-width="6"/>
    </g>
    <text class="ntag" x="80" y="120">«PERSON»</text>
    <text class="ntitle" x="80" y="148">Security analyst</text>
    <text class="nsub" x="80" y="170">Triages alerts,</text>
    <text class="nsub" x="80" y="188">drills into flows</text>

    <g filter="url(#soft)">
      <rect x="60" y="392" width="240" height="120" rx="16" fill="#10141f" stroke="#818cf8" stroke-width="1.6"/>
      <rect x="60" y="392" width="240" height="120" rx="16" fill="none" stroke="rgba(129,140,248,.25)" stroke-width="6"/>
    </g>
    <text class="ntag" x="80" y="420">«PERSON»</text>
    <text class="ntitle" x="80" y="448">ML engineer</text>
    <text class="nsub" x="80" y="470">Retrains the model,</text>
    <text class="nsub" x="80" y="488">reloads via /admin</text>

    <!-- central system -->
    <g filter="url(#glow)">
      <rect x="448" y="232" width="268" height="176" rx="18" fill="url(#sysg)" stroke="#9457ff" stroke-width="2"/>
    </g>
    <text class="ntag" x="582" y="266" text-anchor="middle" fill="#b9a8ff">«SOFTWARE SYSTEM»</text>
    <text class="ntitle" x="582" y="298" text-anchor="middle" style="font-size:19px;">Network Traffic</text>
    <text class="ntitle" x="582" y="322" text-anchor="middle" style="font-size:19px;">Anomaly Detector</text>
    <text class="mono" x="582" y="352" text-anchor="middle">FastAPI · scikit-learn</text>
    <text class="mono" x="582" y="372" text-anchor="middle">React + Streamlit</text>

    <!-- external (right) -->
    <g filter="url(#soft)">
      <rect x="864" y="92" width="240" height="120" rx="16" fill="#0c0f17" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="5 4"/>
    </g>
    <text class="ntag" x="884" y="120" fill="#5f6470">«EXTERNAL»</text>
    <text class="ntitle" x="884" y="148" style="font-size:15px;">PCAP / CSV sources</text>
    <text class="nsub" x="884" y="170">CICFlowMeter</text>
    <text class="nsub" x="884" y="188">offline capture</text>

    <g filter="url(#soft)">
      <rect x="864" y="392" width="240" height="120" rx="16" fill="#0c0f17" stroke="#10b981" stroke-width="1.4" stroke-dasharray="5 4"/>
    </g>
    <text class="ntag" x="884" y="420" fill="#5f6470">«EXTERNAL»</text>
    <text class="ntitle" x="884" y="448" style="font-size:15px;">SIEM / SOC</text>
    <text class="nsub" x="884" y="470">Splunk · Elastic</text>
    <text class="nsub" x="884" y="488">Wazuh</text>
  </svg>

  <div class="legend">
    <span><i style="background:#10141f;border:1px solid #818cf8"></i> Person (actor)</span>
    <span><i style="background:#23275f;border:1px solid #9457ff"></i> The system in scope</span>
    <span><i style="background:#0c0f17;border:1px dashed #3b82f6"></i> External system</span>
  </div>
</div>

<!-- ============================ CONTAINER ============================ -->
<div class="frame" id="container">
  <div class="head">
    <span class="badge">C4 · Level 2 — Containers</span>
  </div>
  <svg width="1164" height="740" viewBox="0 0 1164 740">
    <defs>
      <linearGradient id="apig" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0f3b2e"/><stop offset="1" stop-color="#0c2420"/>
      </linearGradient>
      <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#10b981" flood-opacity="0.5"/>
      </filter>
      <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
      </filter>
      <marker id="a_p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9457ff"/></marker>
      <marker id="a_b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker>
      <marker id="a_c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#06b6d4"/></marker>
      <marker id="a_r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
      <marker id="a_o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f97316"/></marker>
    </defs>

    <!-- arrows -->
    <g fill="none" stroke-width="2.2">
      <line x1="310" y1="150" x2="446" y2="210" stroke="#9457ff" marker-end="url(#a_p)"/>
      <line x1="310" y1="330" x2="446" y2="276" stroke="#9457ff" marker-end="url(#a_p)"/>
      <line x1="754" y1="210" x2="906" y2="156" stroke="#3b82f6" marker-end="url(#a_b)"/>
      <line x1="754" y1="276" x2="906" y2="330" stroke="#3b82f6" marker-end="url(#a_b)"/>
      <line x1="492" y1="640" x2="586" y2="640" stroke="#ef4444" marker-end="url(#a_r)"/>
      <path d="M770 574 C 748 455, 705 372, 652 333" stroke="#06b6d4" marker-end="url(#a_c)"/>
      <path d="M150 210 C 110 360, 150 500, 300 572" stroke="#f97316" stroke-dasharray="6 5" marker-end="url(#a_o)"/>
    </g>
    <g text-anchor="middle">
      <rect x="316" y="172" width="96" height="19" rx="6" fill="#0a0d14" opacity="0.75"/>
      <text class="alabel" x="364" y="186">HTTP / JSON</text>
      <rect x="788" y="170" width="64" height="19" rx="6" fill="#0a0d14" opacity="0.75"/>
      <text class="alabel" x="820" y="184">loads</text>
      <rect x="786" y="300" width="70" height="19" rx="6" fill="#0a0d14" opacity="0.75"/>
      <text class="alabel" x="821" y="314">audits</text>
      <rect x="490" y="606" width="100" height="19" rx="6" fill="#0a0d14" opacity="0.75"/>
      <text class="alabel" x="540" y="620">real packets</text>
      <rect x="652" y="470" width="106" height="19" rx="6" fill="#0a0d14" opacity="0.75"/>
      <text class="alabel" x="705" y="484">POST /predict</text>
      <rect x="60" y="372" width="92" height="19" rx="6" fill="#0a0d14" opacity="0.75"/>
      <text class="alabel" x="106" y="386" fill="#f9a558">"Run on lab"</text>
    </g>

    <!-- clients (left, purple) -->
    <g filter="url(#soft2)"><rect x="50" y="90" width="260" height="120" rx="15" fill="#15101f" stroke="#9457ff" stroke-width="1.6"/></g>
    <rect x="50" y="90" width="6" height="120" rx="3" fill="#9457ff"/>
    <text class="ntag" x="74" y="118" fill="#b9a8ff">«CONTAINER · SPA»</text>
    <text class="ntitle" x="74" y="146" style="font-size:15px;">React + TypeScript</text>
    <text class="mono" x="74" y="170">Vite · Plotly</text>
    <text class="mono" x="74" y="190">:5173 / nginx :80</text>

    <g filter="url(#soft2)"><rect x="50" y="270" width="260" height="120" rx="15" fill="#15101f" stroke="#9457ff" stroke-width="1.6"/></g>
    <rect x="50" y="270" width="6" height="120" rx="3" fill="#9457ff"/>
    <text class="ntag" x="74" y="298" fill="#b9a8ff">«CONTAINER · UI»</text>
    <text class="ntitle" x="74" y="326" style="font-size:15px;">Streamlit dashboard</text>
    <text class="mono" x="74" y="350">Plotly</text>
    <text class="mono" x="74" y="370">:8501</text>

    <!-- API hub (center, green) -->
    <g filter="url(#glow2)"><rect x="446" y="146" width="308" height="184" rx="18" fill="url(#apig)" stroke="#10b981" stroke-width="2"/></g>
    <text class="ntag" x="600" y="180" text-anchor="middle" fill="#5ee3b0">«CONTAINER · API»</text>
    <text class="ntitle" x="600" y="212" text-anchor="middle" style="font-size:18px;">FastAPI service</text>
    <text class="mono" x="600" y="240" text-anchor="middle">Pydantic v2 · scikit-learn</text>
    <text class="mono" x="600" y="262" text-anchor="middle">stateless /predict</text>
    <text class="mono" x="600" y="290" text-anchor="middle" fill="#5ee3b0">:8000 · 6 endpoints</text>

    <!-- datastores (right, blue) -->
    <g filter="url(#soft2)"><rect x="906" y="90" width="232" height="120" rx="15" fill="#0b1320" stroke="#3b82f6" stroke-width="1.5"/></g>
    <text class="ntag" x="928" y="118" fill="#7fb0ff">«ARTEFACT»</text>
    <text class="ntitle" x="928" y="146" style="font-size:15px;">Model bundle</text>
    <text class="mono" x="928" y="170">best.joblib</text>
    <text class="mono" x="928" y="190">pipeline + model</text>

    <g filter="url(#soft2)"><rect x="906" y="270" width="232" height="120" rx="15" fill="#0b1320" stroke="#3b82f6" stroke-width="1.5"/></g>
    <text class="ntag" x="928" y="298" fill="#7fb0ff">«DATA STORE»</text>
    <text class="ntitle" x="928" y="326" style="font-size:15px;">SQLite</text>
    <text class="mono" x="928" y="350">alerts.db</text>
    <text class="mono" x="928" y="370">audit log</text>

    <!-- lab (bottom) -->
    <g filter="url(#soft2)"><rect x="170" y="574" width="322" height="132" rx="15" fill="#1a0f10" stroke="#ef4444" stroke-width="1.6"/></g>
    <rect x="170" y="574" width="6" height="132" rx="3" fill="#ef4444"/>
    <text class="ntag" x="194" y="602" fill="#ffa3a3">«CONTAINER · ATTACKER»</text>
    <text class="ntitle" x="194" y="630" style="font-size:15px;">Offensive toolbox</text>
    <text class="mono" x="194" y="654">nmap · hping3 · hydra · sqlmap</text>
    <text class="mono" x="194" y="676">/attack :8001</text>

    <g filter="url(#soft2)"><rect x="586" y="574" width="372" height="132" rx="15" fill="#0a1620" stroke="#06b6d4" stroke-width="1.6"/></g>
    <rect x="586" y="574" width="6" height="132" rx="3" fill="#06b6d4"/>
    <text class="ntag" x="610" y="602" fill="#7fe6f7">«CONTAINER · DEFENDER»</text>
    <text class="ntitle" x="610" y="630" style="font-size:15px;">Capture + auto-block</text>
    <text class="mono" x="610" y="654">nginx · sshd · tcpdump · cicflowmeter</text>
    <text class="mono" x="610" y="676">iptables DROP · :8002</text>
  </svg>

  <div class="legend">
    <span><i style="background:#15101f;border:1px solid #9457ff"></i> Client container</span>
    <span><i style="background:#0c2420;border:1px solid #10b981"></i> API service</span>
    <span><i style="background:#0b1320;border:1px solid #3b82f6"></i> Data / artefact</span>
    <span><i style="background:#1a0f10;border:1px solid #ef4444"></i> Attacker</span>
    <span><i style="background:#0a1620;border:1px solid #06b6d4"></i> Defender</span>
  </div>
</div>

</body>
</html>
